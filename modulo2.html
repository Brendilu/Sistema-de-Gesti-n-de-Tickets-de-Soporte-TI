<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Tickets + Fotos | Prototipo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .app-container {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
            align-items: start;
        }
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }
        /* ——— Formulario ——— */
        .form-card {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 40, 0.15);
            transition: all 0.2s;
        }
        .form-card h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0b2b4b;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-card h2 span {
            background: #e7edf8;
            font-size: 1rem;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            color: #2a5a8c;
            font-weight: 500;
        }
        .subtitle {
            color: #5e6f8d;
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
            border-left: 4px solid #3b7cc9;
            padding-left: 1rem;
        }
        .form-group {
            margin-bottom: 1.4rem;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e3a5f;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }
        label .required {
            color: #c7342e;
            margin-left: 4px;
        }
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #dce5f0;
            border-radius: 14px;
            font-size: 0.95rem;
            background: #fbfdff;
            transition: 0.2s;
            outline: none;
            color: #0b2b4b;
        }
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: #3b7cc9;
            box-shadow: 0 0 0 4px rgba(59, 124, 201, 0.12);
            background: white;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .file-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            background: #f8fafd;
            border-radius: 18px;
            padding: 1.2rem 1rem;
            border: 1.5px dashed #b9cee8;
        }
        .file-input-wrapper input[type="file"] {
            border: none;
            background: transparent;
            padding: 0;
            font-size: 0.9rem;
        }
        .file-input-wrapper input[type="file"]::file-selector-button {
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            font-weight: 500;
            margin-right: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-input-wrapper input[type="file"]::file-selector-button:hover {
            background: #2a5a8c;
        }
        .preview-section {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 0.5rem;
        }
        .thumb-preview {
            position: relative;
            width: 70px;
            height: 70px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            background: #eef3f9;
        }
        .thumb-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .thumb-preview .remove-preview {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(200, 40, 30, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(2px);
            transition: 0.15s;
        }
        .thumb-preview .remove-preview:hover {
            background: #b02a20;
        }
        .btn-primary {
            background: #0b2b4b;
            color: white;
            border: none;
            padding: 1rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 1rem;
            box-shadow: 0 12px 18px -8px rgba(11, 43, 75, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-primary:hover {
            background: #1e4a73;
            transform: translateY(-1px);
            box-shadow: 0 18px 24px -8px rgba(11, 43, 75, 0.4);
        }
        .btn-primary:active {
            transform: translateY(1px);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            pointer-events: none;
            transform: none;
        }
        /* ——— Dashboard ——— */
        .dashboard-card {
            background: white;
            border-radius: 24px;
            padding: 1.8rem 1.5rem;
            box-shadow: 0 20px 35px -8px rgba(0, 20, 40, 0.1);
            display: flex;
            flex-direction: column;
            max-height: 85vh;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .dashboard-header h3 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #0b2b4b;
        }
        .badge-count {
            background: #e7edf8;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            color: #1e3a5f;
        }
        .tickets-list {
            list-style: none;
            overflow-y: auto;
            padding-right: 6px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }
        .ticket-item {
            background: #f9fcff;
            border-radius: 18px;
            padding: 1.2rem;
            border: 1px solid #e1eaf3;
            transition: 0.15s;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-start;
            justify-content: space-between;
        }
        .ticket-item:hover {
            border-color: #b9cee8;
            background: white;
            box-shadow: 0 8px 14px -6px rgba(0, 20, 40, 0.08);
        }
        .ticket-info {
            flex: 1 1 200px;
        }
        .ticket-title {
            font-weight: 700;
            color: #0b2b4b;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .ticket-meta {
            font-size: 0.78rem;
            color: #5e6f8d;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 0.6rem;
        }
        .ticket-desc {
            font-size: 0.9rem;
            color: #2e405e;
            margin-bottom: 0.6rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .ticket-thumbs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .ticket-thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid #d8e2ee;
            background: #eef3f9;
            cursor: pointer;
            transition: 0.1s;
        }
        .ticket-thumb:hover {
            transform: scale(1.02);
            border-color: #3b7cc9;
        }
        .ticket-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-icon {
            background: white;
            border: 1px solid #d0ddeb;
            border-radius: 30px;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e3a5f;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-icon:hover {
            background: #e7edf8;
            border-color: #b0c6dd;
        }
        .btn-icon.delete {
            color: #b02a20;
            border-color: #f3d7d5;
        }
        .btn-icon.delete:hover {
            background: #fce9e8;
            border-color: #e0b3b0;
        }
        .empty-message {
            text-align: center;
            color: #8a9bb5;
            padding: 2.5rem 1rem;
            font-style: italic;
            background: #f8fafd;
            border-radius: 24px;
        }
        .priority-badge {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .priority-alta { background: #fde7e6; color: #b02a20; }
        .priority-media { background: #fff2db; color: #a86800; }
        .priority-baja { background: #e3f0e9; color: #1f6e4a; }
        /* Modal detalle */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 43, 75, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 50px -12px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            background: #f0f4fa;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2a4b6e;
        }
        .modal-close:hover {
            background: #e1e9f3;
        }
        .modal-content h3 {
            font-size: 1.6rem;
            color: #0b2b4b;
            margin-bottom: 0.5rem;
            padding-right: 2rem;
        }
        .modal-detail p {
            margin: 0.7rem 0;
            color: #2e405e;
        }
        .modal-photos {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 1.5rem;
        }
        .modal-photos img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #d8e2ee;
            cursor: pointer;
            transition: 0.1s;
        }
        .modal-photos img:hover {
            transform: scale(1.02);
            border-color: #3b7cc9;
        }
        .full-image-preview {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            padding: 2rem;
        }
        .full-image-preview.active {
            visibility: visible;
            opacity: 1;
        }
        .full-image-preview img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
        }
        .full-image-preview .close-preview {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eef3f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b9cee8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #93aecf;
        }
        .toast-message {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #0b2b4b;
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 60px;
            font-weight: 500;
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
            z-index: 3000;
            box-shadow: 0 15px 25px -8px rgba(0,0,0,0.3);
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .toast-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Columna izquierda: Formulario -->
    <div class="form-card">
        <h2>📋 Nuevo Ticket <span>prototipo</span></h2>
        <div class="subtitle">Registra incidencias con evidencia fotográfica</div>

        <form id="ticketForm">
            <div class="form-group">
                <label>Título del ticket <span class="required">*</span></label>
                <input type="text" id="titulo" placeholder="Ej: Error al iniciar sesión" required>
            </div>

            <div class="form-group">
                <label>Descripción <span class="required">*</span></label>
                <textarea id="descripcion" placeholder="Describe el problema con detalle..." required></textarea>
            </div>

            <div class="form-group">
                <label>Categoría / Prioridad <span class="required">*</span></label>
                <select id="categoria">
                    <option value="Alta">🔴 Alta</option>
                    <option value="Media" selected>🟡 Media</option>
                    <option value="Baja">🟢 Baja</option>
                </select>
            </div>

            <div class="form-group">
                <label>Adjuntar fotos (imágenes)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept="image/*" multiple>
                    <div class="preview-section" id="previewContainer"></div>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">📤 Registrar ticket</button>
        </form>
    </div>

    <!-- Columna derecha: Dashboard -->
    <div class="dashboard-card">
        <div class="dashboard-header">
            <h3>📌 Tickets registrados</h3>
            <span class="badge-count" id="ticketCount">0</span>
        </div>
        <ul class="tickets-list" id="ticketsList">
            <!-- se llena dinámicamente -->
            <li class="empty-message">No hay tickets registrados aún.</li>
        </ul>
    </div>
</div>

<!-- Modal detalle -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-content" id="modalContent">
        <button class="modal-close" id="closeModalBtn">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<!-- Visor de imagen completa -->
<div class="full-image-preview" id="fullImagePreview">
    <img src="" alt="Vista completa" id="fullImage">
    <button class="close-preview" id="closeFullImage">&times;</button>
</div>

<!-- Toast -->
<div class="toast-message" id="toast"></div>

<script>
    (function() {
        // ---------- ESTADO ----------
        let tickets = [];                // arreglo de tickets (con fotos base64)
        let pendingFiles = [];           // archivos validados listos para previsualizar (File objects)
        let pendingBase64 = [];          // sus correspondientes base64 (mismo índice)

        // ---------- REFERENCIAS DOM ----------
        const form = document.getElementById('ticketForm');
        const tituloInput = document.getElementById('titulo');
        const descripcionInput = document.getElementById('descripcion');
        const categoriaSelect = document.getElementById('categoria');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const ticketsList = document.getElementById('ticketsList');
        const ticketCount = document.getElementById('ticketCount');
        const detailModal = document.getElementById('detailModal');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const fullImagePreview = document.getElementById('fullImagePreview');
        const fullImage = document.getElementById('fullImage');
        const closeFullImage = document.getElementById('closeFullImage');
        const toast = document.getElementById('toast');

        // ---------- UTILIDADES ----------
        function showToast(msg, duration = 2500) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        // Validar tipo MIME real usando FileReader
        function validateImageMime(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const arr = new Uint8Array(e.target.result).subarray(0, 4);
                    let header = '';
                    for (let i = 0; i < arr.length; i++) {
                        header += arr[i].toString(16).padStart(2, '0');
                    }
                    // Firmas: jpeg (ffd8ff), png (89504e47), gif (474946), webp (52494646 + 57454250)
                    const isJpeg = header.startsWith('ffd8ff');
                    const isPng = header.startsWith('89504e47');
                    const isGif = header.startsWith('474946');
                    const isWebp = header.startsWith('52494646') && header.includes('57454250');
                    if (isJpeg || isPng || isGif || isWebp) {
                        resolve(true);
                    } else {
                        resolve(false);
                    }
                };
                reader.onerror = () => resolve(false);
                reader.readAsArrayBuffer(file.slice(0, 12));
            });
        }

        // Convierte File a Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ---------- MANEJO DE ARCHIVOS (PREVISUALIZACIÓN) ----------
        async function handleFiles(files) {
            const fileList = Array.from(files);
            for (const file of fileList) {
                // Validar que sea imagen por tipo MIME real
                const isValid = await validateImageMime(file);
                if (!isValid) {
                    showToast(`"${file.name}" no es una imagen válida (JPEG, PNG, GIF, WEBP)`, 3000);
                    continue;
                }
                // Evitar duplicados por nombre y tamaño (simple)
                const existe = pendingFiles.some(f => f.name === file.name && f.size === file.size);
                if (existe) {
                    showToast(`"${file.name}" ya está adjunto`, 2000);
                    continue;
                }
                try {
                    const base64 = await fileToBase64(file);
                    pendingFiles.push(file);
                    pendingBase64.push(base64);
                    renderPreview();
                } catch (err) {
                    showToast(`Error al procesar "${file.name}"`, 2000);
                }
            }
            // Limpiar input para permitir subir el mismo archivo de nuevo si se desea
            fileInput.value = '';
        }

        // Renderiza las miniaturas pendientes
        function renderPreview() {
            previewContainer.innerHTML = '';
            pendingBase64.forEach((base64, index) => {
                const div = document.createElement('div');
                div.className = 'thumb-preview';
                const img = document.createElement('img');
                img.src = base64;
                img.alt = `preview-${index}`;
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-preview';
                removeBtn.innerHTML = '✕';
                removeBtn.type = 'button';
                removeBtn.dataset.index = index;
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = Number(e.target.dataset.index);
                    pendingFiles.splice(idx, 1);
                    pendingBase64.splice(idx, 1);
                    renderPreview();
                });
                div.appendChild(img);
                div.appendChild(removeBtn);
                previewContainer.appendChild(div);
            });
        }

        // ---------- ALMACENAMIENTO LOCAL ----------
        function loadTicketsFromStorage() {
            const stored = localStorage.getItem('prototipo_tickets');
            if (stored) {
                try {
                    tickets = JSON.parse(stored);
                } catch (e) {
                    tickets = [];
                }
            } else {
                tickets = [];
            }
            renderTickets();
        }

        function saveTicketsToStorage() {
            localStorage.setItem('prototipo_tickets', JSON.stringify(tickets));
        }

        // ---------- RENDERIZAR LISTA DE TICKETS ----------
        function renderTickets() {
            ticketCount.textContent = tickets.length;
            if (tickets.length === 0) {
                ticketsList.innerHTML = '<li class="empty-message">No hay tickets registrados aún.</li>';
                return;
            }

            ticketsList.innerHTML = '';
            // Orden: más reciente primero
            const sorted = [...tickets].sort((a, b) => b.id - a.id);

            sorted.forEach(ticket => {
                const li = document.createElement('li');
                li.className = 'ticket-item';
                li.dataset.id = ticket.id;

                // Información principal
                const infoDiv = document.createElement('div');
                infoDiv.className = 'ticket-info';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'ticket-title';
                titleDiv.innerHTML = `${escapeHtml(ticket.titulo)} 
                    <span class="priority-badge priority-${ticket.categoria.toLowerCase()}">${ticket.categoria}</span>`;

                const metaDiv = document.createElement('div');
                metaDiv.className = 'ticket-meta';
                metaDiv.innerHTML = `<span>📅 ${new Date(ticket.fecha).toLocaleString()}</span>
                                     <span>🆔 #${ticket.id}</span>
                                     <span>📎 ${ticket.fotos.length} foto(s)</span>`;

                const descDiv = document.createElement('div');
                descDiv.className = 'ticket-desc';
                descDiv.textContent = ticket.descripcion;

                // Miniaturas (máximo 4 visibles)
                const thumbsDiv = document.createElement('div');
                thumbsDiv.className = 'ticket-thumbs';
                const maxThumbs = Math.min(ticket.fotos.length, 4);
                for (let i = 0; i < maxThumbs; i++) {
                    const img = document.createElement('img');
                    img.className = 'ticket-thumb';
                    img.src = ticket.fotos[i];
                    img.alt = `foto-${i}`;
                    img.loading = 'lazy';
                    // Al hacer clic abre la imagen en grande (visor completo)
                    img.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openFullImage(ticket.fotos[i]);
                    });
                    thumbsDiv.appendChild(img);
                }
                if (ticket.fotos.length > 4) {
                    const moreSpan = document.createElement('span');
                    moreSpan.style.alignSelf = 'center';
                    moreSpan.style.fontSize = '0.75rem';
                    moreSpan.style.color = '#5e6f8d';
                    moreSpan.textContent = `+${ticket.fotos.length - 4}`;
                    thumbsDiv.appendChild(moreSpan);
                }

                infoDiv.appendChild(titleDiv);
                infoDiv.appendChild(metaDiv);
                infoDiv.appendChild(descDiv);
                infoDiv.appendChild(thumbsDiv);

                // Acciones
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'ticket-actions';

                const detailBtn = document.createElement('button');
                detailBtn.className = 'btn-icon';
                detailBtn.innerHTML = '🔍 Detalle';
                detailBtn.type = 'button';
                detailBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDetailModal(ticket.id);
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-icon delete';
                deleteBtn.innerHTML = '🗑️ Eliminar';
                deleteBtn.type = 'button';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTicket(ticket.id);
                });

                actionsDiv.appendChild(detailBtn);
                actionsDiv.appendChild(deleteBtn);

                li.appendChild(infoDiv);
                li.appendChild(actionsDiv);
                ticketsList.appendChild(li);
            });
        }

        // Escapar HTML para prevenir XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---------- ELIMINAR TICKET ----------
        function deleteTicket(id) {
            if (!confirm('¿Eliminar este ticket de forma permanente?')) return;
            tickets = tickets.filter(t => t.id !== id);
            saveTicketsToStorage();
            renderTickets();
            showToast('Ticket eliminado', 1500);
            // Cerrar modal si estaba abierto con ese ticket
            if (detailModal.classList.contains('active')) {
                const currentId = detailModal.dataset.ticketId;
                if (currentId == id) closeModal();
            }
        }

        // ---------- MODAL DETALLE ----------
        function openDetailModal(id) {
            const ticket = tickets.find(t => t.id === id);
            if (!ticket) return;
            detailModal.dataset.ticketId = id;
            modalBody.innerHTML = `
                <h3>${escapeHtml(ticket.titulo)}</h3>
                <div class="modal-detail">
                    <p><strong>🆔 Ticket:</strong> #${ticket.id}</p>
                    <p><strong>📅 Fecha:</strong> ${new Date(ticket.fecha).toLocaleString()}</p>
                    <p><strong>🏷️ Categoría/Prioridad:</strong> <span class="priority-badge priority-${ticket.categoria.toLowerCase()}">${ticket.categoria}</span></p>
                    <p><strong>📝 Descripción:</strong> ${escapeHtml(ticket.descripcion)}</p>
                    <p><strong>📸 Fotos adjuntas (${ticket.fotos.length}):</strong></p>
                </div>
            `;
            if (ticket.fotos.length > 0) {
                const photosDiv = document.createElement('div');
                photosDiv.className = 'modal-photos';
                ticket.fotos.forEach((foto, idx) => {
                    const img = document.createElement('img');
                    img.src = foto;
                    img.alt = `foto-${idx}`;
                    img.addEventListener('click', () => openFullImage(foto));
                    photosDiv.appendChild(img);
                });
                modalBody.appendChild(photosDiv);
            } else {
                const p = document.createElement('p');
                p.textContent = 'Sin fotos adjuntas.';
                p.style.marginTop = '1rem';
                p.style.color = '#8a9bb5';
                modalBody.appendChild(p);
            }
            detailModal.classList.add('active');
        }

        function closeModal() {
            detailModal.classList.remove('active');
            delete detailModal.dataset.ticketId;
        }

        // ---------- VISOR DE IMAGEN COMPLETA ----------
        function openFullImage(src) {
            fullImage.src = src;
            fullImagePreview.classList.add('active');
        }

        function closeFullImageFunc() {
            fullImagePreview.classList.remove('active');
            fullImage.src = '';
        }

        // ---------- REGISTRO DE TICKET (SIMULACIÓN MULTIPART) ----------
        async function handleSubmit(e) {
            e.preventDefault();

            const titulo = tituloInput.value.trim();
            const descripcion = descripcionInput.value.trim();
            const categoria = categoriaSelect.value;

            if (!titulo || !descripcion) {
                showToast('Completa título y descripción', 2000);
                return;
            }

            // Simular envío multipart / retardo de red
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Enviando...';

            // Simulamos un pequeño delay para emular el envío multipart
            await new Promise(resolve => setTimeout(resolve, 600));

            // Crear nuevo ticket con las fotos pendientes (base64)
            const nuevoTicket = {
                id: Date.now(),
                titulo: titulo,
                descripcion: descripcion,
                categoria: categoria,
                fecha: new Date().toISOString(),
                fotos: [...pendingBase64]  // array de base64
            };

            // Guardar en "base de datos" local
            tickets.push(nuevoTicket);
            saveTicketsToStorage();
            renderTickets();

            // Resetear formulario y miniaturas
            form.reset();
            pendingFiles = [];
            pendingBase64 = [];
            renderPreview();

            submitBtn.disabled = false;
            submitBtn.textContent = '📤 Registrar ticket';

            showToast(`Ticket #${nuevoTicket.id} registrado con ${nuevoTicket.fotos.length} foto(s)`, 2500);
        }

        // ---------- EVENT LISTENERS ----------
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        });

        // Drag & drop sencillo para el input file (opcional, pero mejora UX)
        const fileWrapper = document.querySelector('.file-input-wrapper');
        fileWrapper.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileWrapper.style.borderColor = '#3b7cc9';
            fileWrapper.style.background = '#f0f7ff';
        });
        fileWrapper.addEventListener('dragleave', (e) => {
            e.preventDefault();
            fileWrapper.style.borderColor = '#b9cee8';
            fileWrapper.style.background = '#f8fafd';
        });
        fileWrapper.addEventListener('drop', (e) => {
            e.preventDefault();
            fileWrapper.style.borderColor = '#b9cee8';
            fileWrapper.style.background = '#f8fafd';
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        form.addEventListener('submit', handleSubmit);

        closeModalBtn.addEventListener('click', closeModal);
        detailModal.addEventListener('click', (e) => {
            if (e.target === detailModal) closeModal();
        });

        closeFullImage.addEventListener('click', closeFullImageFunc);
        fullImagePreview.addEventListener('click', (e) => {
            if (e.target === fullImagePreview) closeFullImageFunc();
        });

        // Cerrar con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (fullImagePreview.classList.contains('active')) closeFullImageFunc();
                else if (detailModal.classList.contains('active')) closeModal();
            }
        });

        // ---------- INICIALIZAR ----------
        function init() {
            loadTicketsFromStorage();
            renderPreview();
        }
        init();

    })();
</script>
</body>
</html>
