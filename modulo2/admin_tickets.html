<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Gestión de Tickets (Módulo 2)</title>
    <link rel="stylesheet" href="css/admin_styles.css">
</head>
<body>
    <header class="admin-header">
        <h1>Panel de Administración - Módulo 2: Control de Tickets</h1>
        <p>Bienvenido, Administrador (Sistemas / Soporte)</p>
    </header>

    <main class="admin-container">
        <!-- Tabla y Botón Nuevo -->
        <section class="card-table">
            <div class="table-header-flex">
                <h2>Listado General de Tickets</h2>
                <button id="btn-nuevo" class="btn btn-primary">+ NUEVO</button>
            </div>
            <div class="table-responsive">
                <table id="tickets-table">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                            <th>Solicitante ID</th>
                            <th>Técnico ID</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tickets-tbody">
                        <!-- Se llena mediante JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Ventana Modal para Registrar / Editar Ticket -->
    <div id="ticket-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Registrar / Editar Ticket</h2>
                <button type="button" id="modal-close" class="btn-close">&times;</button>
            </div>
            
            <form id="ticket-form">
                <input type="hidden" id="ticket-id">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="codigo">Código (Ej. TCK-0042):</label>
                        <input type="text" id="codigo" required placeholder="TCK-XXXX">
                    </div>

                    <div class="form-group">
                        <label for="titulo">Título:</label>
                        <input type="text" id="titulo" required placeholder="Resumen del problema">
                    </div>

                    <div class="form-group full-width">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" rows="3" required placeholder="Detalle completo del incidente"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="prioridad_id">Prioridad:</label>
                        <select id="prioridad_id" required>
                            <option value="1">Alta (SLA: 4h)</option>
                            <option value="2" selected>Media (SLA: 24h)</option>
                            <option value="3">Baja (SLA: 72h)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="estado_id">Estado:</label>
                        <select id="estado_id" required>
                            <option value="1">Nuevo</option>
                            <option value="2" selected>Abierto</option>
                            <option value="3">En proceso</option>
                            <option value="4">Resuelto</option>
                            <option value="5">Cerrado</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="solicitante_id">ID Solicitante (Empleado):</label>
                        <input type="number" id="solicitante_id" placeholder="Ej. 14">
                    </div>

                    <div class="form-group">
                        <label for="tecnico_id">ID Técnico Asignado:</label>
                        <input type="number" id="tecnico_id" placeholder="Ej. 3">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn btn-primary">Guardar Ticket</button>
                    <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./js/admin_logic.js"></script>
</body>
</html>
